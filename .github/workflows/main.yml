name: Expressions2 shadow build

on:
  workflow_dispatch:

concurrency:
  group: expressions2-shadow-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expressions2-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"
      - name: Run Source-only shadow builder
        env:
          GH_TOKEN: ${{ github.token }}
          EXPRESSIONS2_REPOSITORY: ${{ github.repository }}
          EXPRESSIONS2_BRANCH: expressions2-development
        run: python Expressions2-development/Batch001/remote/remote_build.py
