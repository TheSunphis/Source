name: Expressions2 parallel shadow pilot

on:
  workflow_dispatch:

concurrency:
  group: expressions2-shadow-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  pilot-shard:
    name: Pilot candidate shard ${{ matrix.index }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Germinal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"
      - name: Build one private pilot shard
        env:
          GH_TOKEN: ${{ github.token }}
          EXPRESSIONS2_REPOSITORY: ${{ github.repository }}
          EXPRESSIONS2_BRANCH: Germinal
          EXPRESSIONS2_MODE: pilot-shard
          EXPRESSIONS2_PILOT_INDEX: ${{ matrix.index }}
          EXPRESSIONS2_RUN_ID: ${{ github.run_id }}
        run: python Expressions2-development/Batch001/remote/remote_build.py

  pilot-merge:
    name: Merge and enforce eight-family gate
    if: ${{ always() }}
    needs: pilot-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Germinal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"
      - name: Merge private shards and enforce all gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPRESSIONS2_REPOSITORY: ${{ github.repository }}
          EXPRESSIONS2_BRANCH: Germinal
          EXPRESSIONS2_MODE: pilot-merge
          EXPRESSIONS2_RUN_ID: ${{ github.run_id }}
        run: python Expressions2-development/Batch001/remote/remote_build.py
