name: Expressions2 shadow build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-remote-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expressions2-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"
      - name: Validate Source-only metadata
        env:
          EXPRESSIONS2_EVIDENCE_MODE: metadata-only
        run: python Expressions2-development/Batch001/tools/run_contract_tests.py
      - name: Enforce clean-room boundary
        run: python Expressions2-development/Batch001/tools/guard_clean_room.py --self-test
